# Finite-difference bump study (SPEC 7).
# Design and hypotheses: docs/notes/phase_3_bump_study.md (registered before running).

option_type = "CALL"
eta_exponents = { start = -1.0, stop = -12.0, step = -0.5 }  # eta = 10^-1, 10^-1.5, ..., 10^-12
x_scale = 1.0  # h = eta * max(|x|, x_scale) (SPEC 7)

[market]
S = 100.0
K = 100.0
T = 0.5
r = 0.05
q = 0.02
sigma = 0.25

[surface]  # 3D surface and heatmap, delta and gamma
S = [70.0, 75.0, 80.0, 85.0, 90.0, 95.0, 100.0, 105.0, 110.0, 115.0, 120.0, 125.0, 130.0]

[short_maturity]  # D4: theta near T = 0 by one-sided differences
T = 0.0027397260273972603  # 1 / 365

[checks]  # registered in the note, section 2
right_window = [-3.0, -2.5, -2.0]  # log10 eta
left_window = [-12.0, -11.5, -11.0, -10.5, -10.0]
right_slope_band = [1.7, 2.3]
left_slope_band_first = [-1.5, -0.5]
left_slope_band_second = [-2.5, -1.5]
optimum_factor = 10.0  # optimum within this factor of eps^(1/3) or eps^(1/4)
best_error_first = 1e-8
best_error_second = 1e-6
one_sided_window = [-5.0, -4.5, -4.0, -3.5]
forward_first_band = [0.7, 1.3]
forward_order2_band = [1.7, 2.3]

[output]
table_csv = "experiments/results/tables/greek_bumps.csv"
summary_json = "experiments/results/tables/greek_bumps_summary.json"
figure_dir = "experiments/results/figures"
