# Study A2 follow-up: time-value cutoff 0 (docs/notes/study_a2.md, section 9, registered at
# 61420eb before this file existed). F1 to F4 are judged on confirm_grid only; grids A and new
# are rerun for comparison, post hoc.

option_types = ["CALL", "PUT"]
mp_digits = 50
methods = ["brent", "naive_newton", "safeguarded_newton", "lets_be_rational"]
fresh_grids = ["confirm_grid"]

[timing]
repeats = 5  # reported only

[[grids]]
name = "grid_a"  # post hoc
F = 100.0
T = 1.0
x = { start = -6.0, stop = 6.0, step = 0.25 }
s = { low = 1e-4, high = 4.0, count = 60 }

[[grids]]
name = "new_grid"  # post hoc
F = 37.5
T = 0.4
x = { start = -5.875, stop = 5.875, step = 0.25 }
s = { low = 1.3e-4, high = 3.7, count = 57 }

[[grids]]
name = "confirm_grid"  # never run before: F1 to F4 are judged here
F = 2.0
T = 2.5
x = { start = -5.95, stop = 5.95, step = 0.35 }
s = { low = 1.7e-4, high = 3.1, count = 53 }

[followup]
grid = "confirm_grid"
hypotheses = { F1 = "H2", F2 = "H3", F3 = "H1", F4 = "H4" }

[checks]  # A2's registered thresholds, unchanged
h1_region = { abs_x_max = 0.5, s_max = 1e-2 }
h1_max_median_enorm = 4.0
h3_max_median_enorm = 2.0
h3_max_p99_enorm = 20.0
h4_bad_outcomes = ["MAX_ITERATIONS", "BRACKET_FAILURE", "INFEASIBLE"]
h5_max_p99_enorm_lbr = 20.0
h6_max_median_iterations = 12

[output]
table_csv_pattern = "experiments/results/tables/study_a2_followup_{grid}.csv"
summary_json = "experiments/results/tables/study_a2_followup_summary.json"
figure_dir = "experiments/results/figures"
figure_prefix = "study_a2_followup"
