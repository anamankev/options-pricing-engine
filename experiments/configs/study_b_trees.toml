[timing]  # representative case: R4c, American put
case = "R4c"
repeats = 7
crr_n = [10, 20, 40, 80, 160, 320, 640, 1280, 2000]
lr_n = [11, 21, 41, 81, 161, 321, 641, 1281, 2001]
budgets_ms = [1.0, 5.0, 25.0]
b4_min_share = 0.75

[surface]  # reporting only: CRR European error over (strike, N), R1 market otherwise
K = { start = 36.0, stop = 48.0, count = 49 }
n = { start = 10, stop = 400 }

[output]
errors_csv = "experiments/results/tables/study_b_errors.csv"
orders_csv = "experiments/results/tables/study_b_orders.csv"
summary_json = "experiments/results/tables/study_b_summary.json"
