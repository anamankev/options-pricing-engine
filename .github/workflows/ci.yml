# SPEC 13.3. Every push and pull request: lint, format, types and fast tests on Python 3.11
# and 3.12. Manual run (GitHub: Actions > ci > Run workflow) adds the full suite, including
# slow, statistical and oracle tests, with the oracle extra installed.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a 3.11-only failure must not hide the 3.12 result, or vice versa
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pip list  # exact resolved versions, kept in the run log
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q -m "not slow and not statistical and not oracle"

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,oracle]"
      - run: pip list
      - run: pytest -q
